<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QDII 额度监控 · 标普500 / 纳指100</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --seq:         #2a78d6;   /* 得分条（顺序蓝） */
    --seq-track:   #e1e0d9;
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #d03b3b;
    --good-text:   #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --ink:         #ffffff;
      --ink-2:       #c3c2b7;
      --ink-muted:   #898781;
      --grid:        #2c2c2a;
      --baseline:    #383835;
      --border:      rgba(255,255,255,0.10);
      --seq:         #3987e5;
      --seq-track:   #2c2c2a;
      --good-text:   #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-muted:   #898781;
    --grid:        #2c2c2a;
    --baseline:    #383835;
    --border:      rgba(255,255,255,0.10);
    --seq:         #3987e5;
    --seq-track:   #2c2c2a;
    --good-text:   #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 24px 16px 48px; }

  header h1 { font-size: 22px; margin: 0 0 4px; }
  .updated { color: var(--ink-2); font-size: 13px; }
  .updated .dot { color: var(--good); margin-right: 4px; }

  section.index-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 18px 10px;
    margin-top: 20px;
  }
  section.index-block > h2 { margin: 0 0 12px; font-size: 18px; }

  .tiles { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .tile {
    flex: 1 1 150px; min-width: 150px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px;
  }
  .tile .k { color: var(--ink-2); font-size: 12px; }
  .tile .v { font-size: 20px; font-weight: 650; margin-top: 2px; }
  .tile .s { color: var(--ink-muted); font-size: 12px; }

  h3.sub { font-size: 14px; color: var(--ink-2); margin: 18px 0 6px; font-weight: 600; }

  .controls {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    font-size: 12px; color: var(--ink-2); margin-bottom: 6px;
  }
  .controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .controls input { accent-color: var(--seq); margin: 0; }
  .linkbtn {
    background: none; border: none; padding: 0; font: inherit;
    color: var(--seq); cursor: pointer; text-decoration: underline;
  }

  .table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px 14px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
  thead th {
    color: var(--ink-muted); font-weight: 600; font-size: 12px;
    border-bottom: 1px solid var(--baseline);
    user-select: none; position: sticky; top: 0;
    background: var(--surface);
  }
  thead th.sortable { cursor: pointer; }
  thead th.sorted { color: var(--ink); }
  tbody tr { border-bottom: 1px solid var(--grid); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr.suspended { opacity: 0.62; }
  td.num, th.num { font-variant-numeric: tabular-nums; }
  td .code { color: var(--ink-muted); font-size: 12px; margin-left: 6px; }
  td a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--baseline); }
  td a:hover { border-bottom-color: var(--ink-2); }
  td.card-name .rank-inline { display: none; }
  .empty { color: var(--ink-muted); padding: 14px 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--ink-2); white-space: nowrap;
  }
  .badge i {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; flex: none;
  }
  .badge.good i     { background: var(--good); }
  .badge.warn i     { background: var(--warning); }
  .badge.crit i     { background: var(--critical); }
  .badge.neutral i  { background: var(--baseline); }
  .badge-mini { margin-left: 8px; }

  .limit-strong { font-weight: 650; color: var(--ink); }
  .prem-high { color: var(--serious); font-weight: 600; }

  .scorecell { display: inline-flex; align-items: center; gap: 8px; }
  .scorebar {
    width: 60px; height: 4px; border-radius: 2px;
    background: var(--seq-track); overflow: hidden; flex: none;
  }
  .scorebar span { display: block; height: 100%; border-radius: 2px; background: var(--seq); }
  .scoreval { font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }

  footer { margin-top: 22px; color: var(--ink-muted); font-size: 12px; }
  footer p { margin: 6px 0; }
  #load-error { color: var(--critical); padding: 24px 0; display: none; }

  /* 窄屏：表格转为卡片，彻底避免横向滚动 */
  @media (max-width: 760px) {
    .wrap { padding: 18px 12px 40px; }
    section.index-block { padding: 14px 12px 8px; }
    .table-wrap { overflow-x: visible; margin: 0; padding: 0 0 8px; }
    table, tbody { display: block; }
    thead { display: none; }
    tbody tr {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    tbody td {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 0; text-align: right;
    }
    tbody td::before {
      content: attr(data-label);
      color: var(--ink-muted); font-size: 12px; margin-right: 10px;
    }
    td.card-rank { display: none; }
    td.card-name, td.card-full, td.card-score { grid-column: 1 / -1; }
    td.card-name {
      justify-content: flex-start; text-align: left;
      font-weight: 600; padding-bottom: 6px; white-space: normal;
    }
    td.card-name::before { content: none; }
    td.card-name .rank-inline {
      display: inline-block; color: var(--ink-muted);
      font-weight: 600; margin-right: 8px;
    }
    td.card-score { border-top: 1px solid var(--grid); margin-top: 4px; padding-top: 6px; }
    td.card-score .scorecell { flex: 1; margin-left: 12px; }
    td.card-score .scorebar { flex: 1; width: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QDII 额度监控 · 标普500 / 纳指100</h1>
    <div class="updated" id="updated"></div>
  </header>

  <div id="load-error">数据加载失败：请确认 data.js / data.json 已生成（先运行 scraper/fetch_data.py）。</div>
  <div id="app"></div>

  <footer>
    <p id="weights-note"></p>
    <p>基金名称已省略板块标题中重复的指数名与 QDII 字样，鼠标悬停可看完整全称。综合得分为同组（同指数、同场内外）归一化后的加权分，仅用于横向比较：年持有成本=管理费+托管费+销售服务费；限额取自基金公司公告的单日累计购买上限；ETF 的"参考溢价率"=现价相对最近一日净值，含隔夜美股涨跌影响，仅供参考。</p>
    <p>数据来源：天天基金 / 东方财富公开页面，每日刷新一次。本页仅为信息整理，不构成投资建议。</p>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var data = window.FUND_DATA;
  if (!data || !data.funds) {
    document.getElementById("load-error").style.display = "block";
    return;
  }

  var COLLAPSE_N = 12;   // 长表默认只显示前 N 只

  document.getElementById("updated").innerHTML =
    '<span class="dot">●</span>数据更新于 ' + esc(data.updated_at);

  var w = data.weights || {};
  document.getElementById("weights-note").textContent =
    "得分权重：年持有成本 " + pct(w.fee) + " · 跟踪误差 " + pct(w.tracking_error) +
    " · 基金规模 " + pct(w.scale) + " · 申购限额 " + pct(w.limit) +
    "（场内 ETF 不计限额项）。";

  var INDEX_ORDER = ["SPX", "NDX100"];
  var app = document.getElementById("app");

  INDEX_ORDER.forEach(function (idx) {
    var funds = data.funds.filter(function (f) { return f.index === idx; });
    if (!funds.length) return;
    app.appendChild(buildSection(idx, data.indexes[idx] || idx, funds));
  });

  function buildSection(idx, label, funds) {
    var otc = funds.filter(function (f) { return !f.is_etf; });
    var etf = funds.filter(function (f) { return f.is_etf; });

    var sec = document.createElement("section");
    sec.className = "index-block";
    sec.appendChild(el("h2", null, label === "标普500" ? "标普500（SPX）" : "纳指100（NDX100）"));

    var buyable = otc.filter(isBuyable);
    var maxLimit = Math.max.apply(null, [0].concat(
      otc.filter(function (f) { return f.limit_type === "limited"; })
         .map(function (f) { return f.daily_limit; })));
    var hasOpen = otc.some(function (f) { return f.limit_type === "open"; });
    var prems = etf.map(function (f) { return f.premium; }).filter(isNum);
    var minPrem = prems.length ? Math.min.apply(null, prems) : null;

    var tiles = el("div", "tiles");
    tiles.appendChild(tile("场外可申购", buyable.length + " / " + otc.length + " 只", "含限购额度内可买"));
    tiles.appendChild(tile("单日限额最宽",
      hasOpen ? "不限" : (maxLimit > 0 ? fmtMoney(maxLimit) + "/日" : "全部暂停"),
      "场外基金中的最大值"));
    tiles.appendChild(tile("ETF 最低参考溢价", minPrem === null ? "—" : minPrem.toFixed(2) + "%", "溢价越低越接近净值"));
    sec.appendChild(tiles);

    if (otc.length) {
      sec.appendChild(el("h3", "sub", "场外基金（按综合得分排序，额度为每日申购上限）"));
      sec.appendChild(buildTable(otc, false));
    }
    if (etf.length) {
      sec.appendChild(el("h3", "sub", "场内 ETF（券商账户买卖，不受申购限额约束，注意溢价）"));
      sec.appendChild(buildTable(etf, true));
    }
    return sec;
  }

  function buildTable(rows, isEtf) {
    var cols = isEtf ? [
      { key: "_rank",  label: "#" },
      { key: "_name",  label: "基金名称 / 代码" },
      { key: "score",  label: "综合得分" },
      { key: "premium", label: "参考溢价", num: true, full: true, fmt: fmtPremium },
      { key: "price",  label: "现价", num: true,
        fmt: function (f) { return isNum(f.price) ? f.price.toFixed(3) : "—"; } },
      { key: "annual_fee", label: "年持有成本", num: true, fmt: function (f) { return fmtPct(f.annual_fee); } },
      { key: "tracking_error", label: "跟踪误差", num: true, fmt: function (f) { return fmtPct(f.tracking_error); } },
      { key: "scale",  label: "规模", num: true, fmt: function (f) { return fmtScale(f.scale); } }
    ] : [
      { key: "_rank",  label: "#" },
      { key: "_name",  label: "基金名称 / 代码" },
      { key: "score",  label: "综合得分" },
      { key: "daily_limit", label: "申购额度", full: true, fmt: fmtLimitCell, sortVal: limitSortVal },
      { key: "annual_fee", label: "年持有成本", num: true, fmt: function (f) { return fmtPct(f.annual_fee); } },
      { key: "tracking_error", label: "跟踪误差", num: true, fmt: function (f) { return fmtPct(f.tracking_error); } },
      { key: "scale",  label: "规模", num: true, fmt: function (f) { return fmtScale(f.scale); } },
      { key: "buy_fee", label: "申购费", num: true, fmt: function (f) { return fmtPct(f.buy_fee); } }
    ];

    var state = { key: "score", dir: -1, onlyBuyable: false, expanded: false };
    var block = el("div", "table-block");

    // ---- 控制行：筛选 / 展开 ----
    var controls = el("div", "controls");
    var countText = el("span");
    var toggleBtn = el("button", "linkbtn");
    toggleBtn.type = "button";
    toggleBtn.addEventListener("click", function () {
      state.expanded = !state.expanded;
      render();
    });
    if (!isEtf) {
      var lab = el("label");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.addEventListener("change", function () {
        state.onlyBuyable = cb.checked;
        state.expanded = false;
        render();
      });
      lab.appendChild(cb);
      lab.appendChild(el("span", null, "只看可申购"));
      controls.appendChild(lab);
    }
    controls.appendChild(countText);
    controls.appendChild(toggleBtn);
    block.appendChild(controls);

    // ---- 表格 ----
    var wrapEl = el("div", "table-wrap");
    var tbl = document.createElement("table");
    var thead = document.createElement("thead");
    var trh = document.createElement("tr");
    cols.forEach(function (c) {
      var th = el("th", c.num ? "num" : null, c.label);
      if (c.key !== "_rank" && c.key !== "_name") {
        th.classList.add("sortable");
        th.title = "点击排序";
        th.addEventListener("click", function () {
          if (state.key === c.key) { state.dir = -state.dir; }
          else { state.key = c.key; state.dir = -1; }
          render();
        });
      }
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    tbl.appendChild(thead);
    var tbody = document.createElement("tbody");
    tbl.appendChild(tbody);
    wrapEl.appendChild(tbl);
    block.appendChild(wrapEl);

    var emptyMsg = el("div", "empty", "当前没有可申购的基金。");
    emptyMsg.style.display = "none";
    block.appendChild(emptyMsg);

    function render() {
      var col = cols.filter(function (c) { return c.key === state.key; })[0];
      var list = rows.slice();
      if (state.onlyBuyable) list = list.filter(isBuyable);
      list.sort(function (a, b) {
        var va = col && col.sortVal ? col.sortVal(a) : a[state.key];
        var vb = col && col.sortVal ? col.sortVal(b) : b[state.key];
        va = isNum(va) ? va : (state.dir === -1 ? -Infinity : Infinity);
        vb = isNum(vb) ? vb : (state.dir === -1 ? -Infinity : Infinity);
        return state.dir === -1 ? vb - va : va - vb;
      });

      var total = list.length;
      var collapsed = !state.expanded && total > COLLAPSE_N;
      var shown = collapsed ? list.slice(0, COLLAPSE_N) : list;

      Array.prototype.forEach.call(trh.children, function (th, i) {
        th.classList.toggle("sorted", cols[i].key === state.key);
      });

      countText.textContent = collapsed
        ? "共 " + total + " 只，显示得分最高的 " + shown.length + " 只"
        : "共 " + total + " 只，已全部显示";
      toggleBtn.textContent = collapsed ? "展开全部" : (total > COLLAPSE_N ? "收起" : "");
      toggleBtn.style.display = total > COLLAPSE_N ? "" : "none";
      emptyMsg.style.display = total ? "none" : "";
      wrapEl.style.display = total ? "" : "none";

      tbody.innerHTML = "";
      shown.forEach(function (f, i) {
        var tr = document.createElement("tr");
        if (f.limit_type === "suspended") tr.className = "suspended";
        cols.forEach(function (c) {
          var cls = c.num ? "num" : null;
          if (c.key === "_rank") cls = "num card-rank";
          else if (c.key === "_name") cls = "card-name";
          else if (c.key === "score") cls = "num card-score";
          else if (c.full) cls = (cls ? cls + " " : "") + "card-full";
          var td = el("td", cls);
          if (c.key !== "_rank" && c.key !== "_name") td.setAttribute("data-label", c.label);

          if (c.key === "_rank") { td.textContent = i + 1; }
          else if (c.key === "_name") { fillNameCell(td, f, i + 1); }
          else if (c.key === "score") { td.appendChild(scoreCell(f.score)); }
          else { td.innerHTML = c.fmt(f); }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
    render();
    return block;
  }

  // ---- 单元格 ----
  function fillNameCell(td, f, rank) {
    td.appendChild(el("span", "rank-inline", "#" + rank));
    var a = document.createElement("a");
    a.href = "https://fund.eastmoney.com/" + f.code + ".html";
    a.target = "_blank"; a.rel = "noopener";
    a.textContent = shortName(f.name);
    a.title = f.name;
    td.appendChild(a);
    td.appendChild(el("span", "code", f.code));
    // 场内 ETF 申赎暂停会放大溢价，单独标出
    if (f.is_etf && f.limit_type === "suspended") {
      var b = el("span", "badge crit badge-mini");
      b.appendChild(document.createElement("i"));
      b.appendChild(document.createTextNode("申赎暂停"));
      b.title = f.status_mark || "一级市场申赎暂停，溢价可能偏高";
      td.appendChild(b);
    }
  }

  /** 板块标题已注明指数，名称里省去重复的指数名与 QDII 字样 */
  function shortName(full) {
    var s = String(full)
      .replace(/QDII-LOF/g, "LOF")
      .replace(/[（(]\s*QDII\s*[）)]/g, "")
      .replace(/QDII/g, "")
      .replace(/标准普尔500|标普500|纳斯达克100|纳斯达克|纳指100|纳指/g, "")
      .replace(/[（(]\s*[）)]/g, "")
      .replace(/^[·\-\s]+|[·\-\s]+$/g, "")
      .trim();
    if (/^ETF/.test(s)) s = s.replace(/^ETF/, "") + "ETF";  // "ETF嘉实" → "嘉实ETF"
    return s.length >= 2 ? s : String(full);
  }

  function fmtLimitCell(f) {
    var map = {
      open:      ["good", '<span class="limit-strong">不限</span>'],
      limited:   ["warn", '<span class="limit-strong">' + fmtMoney(f.daily_limit) + "/日</span>"],
      unknown:   ["warn", (f.status || "限大额") + "（额度未公布）"],
      suspended: ["crit", "暂停申购"],
      exchange:  ["neutral", "场内交易"]
    };
    var m = map[f.limit_type] || ["neutral", f.status || "—"];
    var t = f.status_mark ? ' title="' + esc(f.status_mark) + '"' : "";
    return '<span class="badge ' + m[0] + '"' + t + "><i></i>" + m[1] + "</span>";
  }
  function limitSortVal(f) {
    if (f.limit_type === "open") return 1e9;
    if (f.limit_type === "limited") return f.daily_limit;
    if (f.limit_type === "suspended") return 0;
    return null;
  }
  function isBuyable(f) {
    return f.limit_type === "limited" || f.limit_type === "open";
  }
  function fmtPremium(f) {
    if (!isNum(f.premium)) return "—";
    var s = f.premium.toFixed(2) + "%";
    if (f.premium >= 5) {
      return '<span class="prem-high" title="现价明显高于净值，买入即承担溢价回落风险">' + s + " ▲高</span>";
    }
    return s;
  }
  function fmtMoney(v) {
    if (!isNum(v)) return "—";
    if (v >= 1e8) return (v / 1e8) + " 亿元";
    if (v >= 1e4) return (v / 1e4) + " 万元";
    return v + " 元";
  }
  function fmtPct(v) { return isNum(v) ? v.toFixed(2) + "%" : "—"; }
  function fmtScale(v) { return isNum(v) ? (v / 1e8).toFixed(1) + " 亿" : "—"; }
  function scoreCell(score) {
    var box = el("span", "scorecell");
    var bar = el("span", "scorebar");
    var fill = document.createElement("span");
    fill.style.width = (isNum(score) ? Math.max(2, Math.min(100, score)) : 0) + "%";
    bar.appendChild(fill);
    box.appendChild(bar);
    box.appendChild(el("span", "scoreval", isNum(score) ? score.toFixed(1) : "—"));
    return box;
  }

  function tile(k, v, s) {
    var t = el("div", "tile");
    t.appendChild(el("div", "k", k));
    t.appendChild(el("div", "v", v));
    if (s) t.appendChild(el("div", "s", s));
    return t;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function pct(x) { return isNum(x) ? Math.round(x * 100) + "%" : "—"; }
})();
</script>
</body>
</html>
